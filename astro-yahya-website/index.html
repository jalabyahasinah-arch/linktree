<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Astro Yahya</title>
    <link rel="stylesheet" href="styles.css?v=2">
  </head>
  <body>
    <main class="page-shell" aria-label="Astro Yahya links">
      <section class="poster-stage" aria-label="Interactive poster">
        <img
          class="poster-image"
          src="assets/astro-yahya-base.png"
          alt="Astro Yahya receipt-style personal link poster"
          width="1023"
          height="1537"
        >
        <div class="link-layer" aria-label="Social links">
          <a
            class="hotspot hotspot-tiktok"
            href="https://www.tiktok.com/@astroyahya1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Astro Yahya on TikTok"
          ></a>
          <a
            class="hotspot hotspot-instagram"
            href="https://www.instagram.com/astroyahya1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Astro Yahya on Instagram"
          ></a>
          <a
            class="hotspot hotspot-snapchat"
            href="https://www.snapchat.com/add/astroyahya1"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open Astro Yahya on Snapchat"
          ></a>
        </div>
      </section>
      <footer class="site-credit">
        <span>programmed and designed by yahya only</span>
        <span lang="ar" dir="rtl">مصنع خصيصا من قبل يحيى</span>
      </footer>
    </main>
  </body>
</html>
